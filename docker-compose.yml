# Celda PostgreSQL 18 con Patroni + HAProxy + PgBouncer, para Docker Swarm.
# etcd es compartido entre celdas y vive en su propio stack (flx-infra/etcd-flexxus), en la red externa etcd-net.
# Antes del deploy: stack etcd-flexxus arriba, imagen de Patroni subida, configs creados (crear-configs.sh)
# y secrets de Docker con las contraseñas (ver README.md). Este archivo no tiene contraseñas.

x-patroni-env: &patroni-env
  PATRONI_SCOPE: ${CELDA:-celda-01}
  PATRONI_ETCD3_HOSTS: "etcd-a:2379,etcd-b:2379,etcd-c:2379"
  PATRONI_SUPERUSER_USERNAME: postgres
  PATRONI_SUPERUSER_PASSWORD_FILE: /run/secrets/pg_superuser_password
  PATRONI_REPLICATION_USERNAME: replicator
  PATRONI_REPLICATION_PASSWORD_FILE: /run/secrets/pg_replication_password
  PATRONI_RESTAPI_USERNAME: patroni
  PATRONI_RESTAPI_PASSWORD_FILE: /run/secrets/patroni_api_password

services:
  # ---------- PostgreSQL 18: corre dentro de estos servicios ----------
  # La imagen (patroni/Dockerfile) es postgres:18 con Patroni encima: Patroni arranca PostgreSQL,
  # lo inicializa, arma la réplica y promueve al otro nodo si cae el primario.
  postgres-worker2:
    image: ${REGISTRO:-fabreguesm}/patroni-pg18:${PATRONI_TAG:-2}
    hostname: postgres-worker2
    environment:
      <<: *patroni-env
      PATRONI_NAME: postgres-worker2
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres-worker2:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres-worker2:8008
    volumes: [pg-data:/var/lib/postgresql/data]
    configs: [{ source: patroni_yml, target: /etc/patroni.yml }]
    secrets: [pg_superuser_password, pg_replication_password, patroni_api_password, pgbouncer_auth_password, flexxuserp_api_password]
    networks: [db-net, etcd-net]
    stop_grace_period: 60s
    deploy:
      placement:
        constraints: ["node.hostname == ${PG_NODE_1:-worker2}"]
      restart_policy: { condition: any }
      resources: { reservations: { memory: 2G } }

  postgres-worker3:
    image: ${REGISTRO:-fabreguesm}/patroni-pg18:${PATRONI_TAG:-2}
    hostname: postgres-worker3
    environment:
      <<: *patroni-env
      PATRONI_NAME: postgres-worker3
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres-worker3:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres-worker3:8008
    volumes: [pg-data:/var/lib/postgresql/data]
    configs: [{ source: patroni_yml, target: /etc/patroni.yml }]
    secrets: [pg_superuser_password, pg_replication_password, patroni_api_password, pgbouncer_auth_password, flexxuserp_api_password]
    networks: [db-net, etcd-net]
    stop_grace_period: 60s
    deploy:
      placement:
        constraints: ["node.hostname == ${PG_NODE_2:-worker3}"]
      restart_policy: { condition: any }
      resources: { reservations: { memory: 2G } }

  # ---------- HAProxy: manda al primario que indica Patroni ----------
  haproxy:
    image: haproxy:3.0
    configs: [{ source: haproxy_cfg, target: /usr/local/etc/haproxy/haproxy.cfg }]
    ports:
      - { target: 5000, published: 15432, protocol: tcp, mode: ingress }   # primario (lectura y escritura)
      - { target: 5001, published: 15433, protocol: tcp, mode: ingress }   # réplicas (solo lectura)
    networks: [db-net]
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1
        constraints: ["node.role == worker"]
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }
      restart_policy: { condition: any }

  # ---------- PgBouncer: modo transacción, delante de HAProxy ----------
  pgbouncer:
    image: edoburu/pgbouncer:${PGBOUNCER_TAG:-latest}   # fijar la versión probada (>= 1.21)
    configs:
      - { source: pgbouncer_ini, target: /etc/pgbouncer/pgbouncer.ini }
    secrets: [pgbouncer_auth_password]
    # Arma userlist.txt con la contraseña del usuario técnico (secret) y arranca PgBouncer.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        printf '"pgbouncer_auth" "%s"\n' "$$(cat /run/secrets/pgbouncer_auth_password)" > /etc/pgbouncer/userlist.txt
        && exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    networks: [db-net, app-net]
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1
        constraints: ["node.role == worker"]
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }
      restart_policy: { condition: any }

# Configs creados antes del deploy con crear-configs.sh (o desde Portainer > Configs).
# Para cambiar uno: crear una versión nueva (celda01_haproxy_cfg_v2) y actualizar el nombre acá.
configs:
  patroni_yml: { external: true, name: celda01_patroni_yml_v1 }
  haproxy_cfg: { external: true, name: celda01_haproxy_cfg_v1 }
  pgbouncer_ini: { external: true, name: celda01_pgbouncer_ini_v1 }

# Secrets con las contraseñas: los crea una persona en Portainer > Secrets.
secrets:
  pg_superuser_password: { external: true }
  pg_replication_password: { external: true }
  patroni_api_password: { external: true }
  pgbouncer_auth_password: { external: true }   # usuario técnico de PgBouncer (auth_query)
  flexxuserp_api_password: { external: true }   # usuario flexxuserp_api, el de la API

networks:
  db-net:            # interna de la celda: Patroni, HAProxy, PgBouncer
    driver: overlay
    attachable: true
  etcd-net:          # la crea el stack etcd-flexxus
    external: true
  app-net:           # la usa la API de Order para llegar a PgBouncer (pgbouncer:6432)
    driver: overlay
    attachable: true
    name: ${CELDA:-celda-01}-app

volumes:
  pg-data:           # volumen local de cada worker de base
