[databases]
; Cualquier base pedida se busca en el primario, a través de HAProxy.
* = host=haproxy port=5000 auth_user=pgbouncer_auth

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
max_client_conn = 5000
default_pool_size = 3
min_pool_size = 0
reserve_pool_size = 2
server_idle_timeout = 60
max_prepared_statements = 200
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; Usuario y contraseña de cada base se leen de la propia base (ver README, init.sql)
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)
ignore_startup_parameters = extra_float_digits
admin_users = pgbouncer_auth
