global
    maxconn 4000

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    mode tcp
    timeout connect 4s
    timeout client 30m
    timeout server 30m
    timeout check 3s
    default-server init-addr none resolvers docker inter 3s fall 3 rise 2 on-marked-down shutdown-sessions

# Estadísticas: http://<nodo>:7000
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

# Escrituras: solo el nodo que Patroni marca como primario (GET /primary = 200)
listen primario
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    server postgres-worker2 postgres-worker2:5432 check port 8008
    server postgres-worker3 postgres-worker3:5432 check port 8008

# Lecturas: las réplicas (GET /replica = 200)
listen replicas
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    server postgres-worker2 postgres-worker2:5432 check port 8008
    server postgres-worker3 postgres-worker3:5432 check port 8008
